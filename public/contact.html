<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contact AnotherExample.">
  <title>Contact — AnotherExample</title>
  <link rel="icon" href="/aefavicon.ico" sizes="any">

  <style>
    :root{
      --bg:#0f1115;
      --card:#171a21;
      --border:#2a2e38;
      --text:#e6e8eb;
      --muted:#9aa0ac;
      --accent:#6ee7b7;
      --code:#10131a;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      line-height:1.6;
    }

    .wrap{
      max-width:720px;
      margin:auto;
      padding:52px 20px 80px;
    }

    a{color:var(--accent)}

    h1{
      font-size:clamp(2rem,6vw,3.2rem);
      line-height:1.05;
      margin:18px 0;
    }

    .lead{color:var(--muted)}

    label{
      display:block;
      margin-top:18px;
      margin-bottom:5px;
      font-weight:600;
    }

    input,textarea{
      width:100%;
      background:#202632;
      color:var(--text);
      border:1px solid #596273;
      border-radius:7px;
      padding:11px 12px;
      font:inherit;
    }

    textarea{
      min-height:180px;
      resize:vertical;
    }

    input:focus-visible,
    textarea:focus-visible{
      outline:2px solid var(--accent);
      outline-offset:2px;
      border-color:var(--accent);
    }

    button{
      margin-top:20px;
      background:var(--accent);
      color:#07130e;
      border:0;
      border-radius:7px;
      padding:11px 16px;
      font-weight:700;
      cursor:pointer;
    }

    .hp{
      position:absolute;
      left:-10000px;
      width:1px;
      height:1px;
      overflow:hidden;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <a href="/">← anotherexample.com</a>

    <h1>Contact AnotherExample</h1>

    <p class="lead">
      Questions, feedback, bug reports, or suggestions are welcome.
    </p>

    <form id="contactForm" method="post" action="/api/contact">

      <label for="name">Name</label>
      <input id="name" name="name" type="text" maxlength="100" autocomplete="name">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="5000" required></textarea>

      <div class="hp" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit">Send message</button>
      <p id="formStatus" role="status" aria-live="polite"></p>

    </form>
  </main>
  <script>
  const form = document.getElementById('contactForm');
  const status = document.getElementById('formStatus');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    status.textContent = 'Sending...';

    try {
      const response = await fetch('/api/contact', {
        method: 'POST',
        body: new FormData(form)
      });

      const result = await response.json();

      if (!response.ok || !result.sent) {
        throw new Error(result.error || 'Unable to send message.');
      }

      form.reset();
      status.textContent = 'Message sent. Thanks for contacting AnotherExample.';
    } catch (error) {
      status.textContent = 'Sorry, your message could not be sent. Please try again.';
    }
  });
</script>
</body>
</html>
